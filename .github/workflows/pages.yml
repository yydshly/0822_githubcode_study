name: Deploy research gallery to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "projects/shuohao-skills/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a docs/. _site/
          mkdir -p _site/demos/shuohao-skills/research
          cp -a projects/shuohao-skills/. _site/demos/shuohao-skills/research/
          rm -rf _site/demos/shuohao-skills/research/upstream/.git

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

