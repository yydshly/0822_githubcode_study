<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="持续拆解、复现和验证开源项目能力的研究实验室。" />
    <title>GitHub 能力研究实验室</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="返回研究展厅首页">
        <span class="brand-mark" aria-hidden="true">08·22</span>
        <span>GitHub 能力研究实验室</span>
      </a>
      <a class="repo-link" href="https://github.com/yydshly/0822_githubcode_study">查看仓库 <span aria-hidden="true">↗</span></a>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">OPEN SOURCE · REPRODUCIBLE RESEARCH</p>
        <h1>把发现，变成<br /><em>可复现的证据。</em></h1>
        <p class="intro">持续拆解 GitHub 与 X 上遇到的有趣项目，保留研究过程、关键判断和可以亲手体验的成果。</p>
        <div class="hero-actions">
          <a class="button primary" href="https://github.com/yydshly/0822_githubcode_study#研究索引">浏览研究索引</a>
          <a class="button secondary" href="https://github.com/yydshly/0822_githubcode_study/issues/new?template=research-proposal.yml">提交研究选题</a>
        </div>
      </section>

      <section class="gallery" aria-labelledby="gallery-title">
        <div class="section-heading">
          <p class="eyebrow">RESEARCH GALLERY</p>
          <h2 id="gallery-title">研究展厅</h2>
        </div>
        <article class="empty-card">
          <div class="empty-icon" aria-hidden="true">01</div>
          <div>
            <p class="card-kicker">PLANNED · FIRST STUDY</p>
            <h3>首个研究项目待定</h3>
            <p>仓库骨架已经准备好。下一项研究会从明确问题、固定上游版本和设计验证证据开始。</p>
          </div>
          <a href="https://github.com/yydshly/0822_githubcode_study/tree/main/projects/_template">查看项目模板 <span aria-hidden="true">→</span></a>
        </article>
      </section>
    </main>

    <footer>
      <p>研究过程优先于结论，证据优先于印象。</p>
    </footer>
  </body>
